# 毎日18時（日本時間）に、夕方のクイズ動画を Instagram のリールに投稿する
#   動画は朝6時の「ショート動画を作る」で作っておく（Releases の short-日付-quiz.mp4）
name: 夕方のクイズ動画を投稿
on:
  schedule:
    - cron: "0 9 * * *"   # UTC 9:00 = 日本時間 18:00
  workflow_dispatch:
    inputs:
      force_post:
        description: "時刻に関係なく今日のクイズ動画を投稿する"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency: publish-post

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instagram に投稿
        id: ig
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          POST_MODE: quiz
          FORCE_POST: ${{ inputs.force_post }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node scripts/post-meta.mjs
      - name: 失敗したら Issue で知らせる
        if: failure() && steps.ig.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$(TZ=Asia/Tokyo date +%F)"
          { echo "夕方のクイズ動画の Instagram 投稿がうまくいきませんでした。"; echo; echo '```'; cat meta-errors.txt 2>/dev/null; echo '```'; echo; \
            echo "直したあと、Actions →「夕方のクイズ動画を投稿」→「Run workflow」で「時刻に関係なく…」にチェックを入れて実行すると、今日の分を投稿します。"; \
            echo; echo "くわしいエラー：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > body.txt
          gh issue create --title "⚠️ 夕方のクイズ動画を投稿できませんでした（$D）" --body-file body.txt
      - name: 投稿の記録を残す
        if: always()
        run: |
          if ! git diff --quiet state/; then
            git config user.name "news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "投稿記録（夕方） [skip ci]"
            git pull --rebase -q origin main
            git push
          fi
