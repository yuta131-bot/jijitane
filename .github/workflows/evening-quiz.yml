# 毎日18時（日本時間）に、夕方のクイズ動画を Instagram のリールと YouTube ショートに投稿する
#   動画は朝の「ショート動画を作る」で作っておく（Releases の short-日付-quiz.mp4）
name: 夕方のクイズ動画を投稿
on:
  schedule:
    - cron: "0 9 * * *"   # UTC 9:00 = 日本時間 18:00
    - cron: "40 9 * * *"  # 予備：GitHub の定時実行は遅れたり抜けたりするので、18:40・19:30 にも動かす
    - cron: "30 10 * * *" #   （上げ済みなら記録を見て二重投稿しない）
  workflow_dispatch:
    inputs:
      force_post:
        description: "時刻に関係なく今日のクイズ動画を投稿する"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency: publish-post

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instagram に投稿
        id: ig
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          POST_MODE: quiz
          FORCE_POST: ${{ inputs.force_post }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node scripts/post-meta.mjs
      - name: YouTube に上げる（公開・子ども向け）
        id: yt
        if: always() && (github.event_name == 'schedule' || inputs.force_post)
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          D="$(TZ=Asia/Tokyo date +%F)"
          if [ ! -f "content/$D.json" ]; then
            echo "$D の号はまだありません"
            echo "no_issue=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "short-$D" -p "short-$D-quiz.mp4" -p "short-$D-quiz.txt" -p "short-$D-quiz-title.txt" -D dist-video
          python3 scripts/upload_youtube.py --date "$D" --dir dist-video --privacy public --quiz --state state/youtube-posted.json
      - name: 今日の号がなくて上げられなかったら Issue で知らせる
        if: always() && github.event_name == 'schedule' && steps.yt.outputs.no_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$(TZ=Asia/Tokyo date +%F)"
          H="$(TZ=Asia/Tokyo date +%H)"
          # 予備の実行で何度も作らないよう、19時以降の最後の実行でだけ作る。同じタイトルが既にあれば作らない
          [ "$H" -ge 19 ] || exit 0
          T="⚠️ 夕方のクイズ動画を上げられませんでした：$D の号がありません"
          if [ -z "$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$T" --body "夕方になっても今日の記事（content/$D.json）がありません。記事のマージ後に、Actions →「ショート動画を作る」と「夕方のクイズ動画を投稿」を Run workflow で動かしてください。"
          fi
      - name: YouTube に上げられなかったら Issue で知らせる
        if: failure() && steps.yt.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$(TZ=Asia/Tokyo date +%F)"
          gh issue create --title "⚠️ 夕方のクイズ動画を YouTube に上げられませんでした（$D）" \
            --body "くわしいエラー：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: 失敗したら Issue で知らせる
        if: failure() && steps.ig.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$(TZ=Asia/Tokyo date +%F)"
          { echo "夕方のクイズ動画の Instagram 投稿がうまくいきませんでした。"; echo; echo '```'; cat meta-errors.txt 2>/dev/null; echo '```'; echo; \
            echo "直したあと、Actions →「夕方のクイズ動画を投稿」→「Run workflow」で「時刻に関係なく…」にチェックを入れて実行すると、今日の分を投稿します。"; \
            echo; echo "くわしいエラー：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > body.txt
          gh issue create --title "⚠️ 夕方のクイズ動画を投稿できませんでした（$D）" --body-file body.txt
      - name: 投稿の記録を残す
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "投稿記録（夕方） [skip ci]"
            git pull --rebase -q origin main
            git push
          fi
