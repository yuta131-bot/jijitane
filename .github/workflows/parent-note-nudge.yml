# 毎朝、「優太さんが自分で書いたほうが効く話題」がある日だけ、Issue でお知らせする
name: 親のひとこと（お知らせ）
on:
  # 毎朝のお知らせは、Claude からの質問（定期タスク「親のひとこと」）に切り替えたので、定時実行はやめた。
  # 手動で動かすと、GitHub の Issue でお知らせする（予備）
  workflow_dispatch:
    inputs:
      date:
        description: "日付（空なら今日）"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: お知らせを出す
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_DATE: ${{ inputs.date }}
        run: node scripts/parent-note-nudge.mjs
