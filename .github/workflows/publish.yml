# 記事がマージされたらサイトを公開し、7時以降なら X に投稿する
name: 公開とX投稿
on:
  push:
    branches: [main]
    paths: ["content/**", "src/**", "scripts/**", "site.config.json"]
  schedule:
    - cron: "30 22 * * *"   # UTC 22:30 = 日本時間 7:30（X への投稿。site.config.json の postHourJst と合わせる）
  workflow_dispatch:
    inputs:
      force_post:
        description: "時刻に関係なく今日の号を投稿する"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    services:
      voicevox:   # サイトの読み上げ音声（VOICEVOX:冥鳴ひまり）を作る
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-zen-maru-v1
      - run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      # 読み上げ音声：直近30日分。文が変わった記事だけ作り直し、作った音声はキャッシュに残す
      - uses: actions/cache@v4
        with:
          path: audio-cache
          key: audio-${{ github.run_id }}
          restore-keys: audio-
      - name: 読み上げ音声を作る
        continue-on-error: true   # うまくいかなくても公開は止めない（その記事は端末の声で読み上げる）
        timeout-minutes: 20
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q playwright==1.49.1 && python -m playwright install --with-deps chromium >/dev/null
          for i in $(seq 1 60); do curl -sf http://localhost:50021/version >/dev/null && break; sleep 3; done
          python3 scripts/make_audio.py --dist dist --cache audio-cache --voicevox http://localhost:50021
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4

  post:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-zen-maru-v1
      - name: X に投稿
        id: xpost
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FORCE_POST: ${{ inputs.force_post }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/post-x.mjs
      - name: 投稿に失敗したら Issue で知らせる
        if: failure() && steps.xpost.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$(TZ=Asia/Tokyo date +%F)"
          gh issue create --title "⚠️ X への投稿に失敗しました（$D）" --body "$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
            "今朝の X への自動投稿が失敗しました。" \
            "- いちばん多い原因は **X のクレジット不足** です。https://developer.x.com（Developer Console） のダッシュボードで「合計残高」を確かめ、少なければ「クレジットを購入する」から追加してください。" \
            "- 残高があるのに失敗した場合は、キー（Secrets の X_ で始まる4つ）が無効になっていないか確かめてください。" \
            "- 追加したあと、Actions →「公開とX投稿」→「Run workflow」で「時刻に関係なく今日の号を投稿する」にチェックを入れて実行すると、今日の分を投稿できます。" \
            "くわしいエラー：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
      - name: 投稿の記録を残す
        run: |
          if ! git diff --quiet state/; then
            git config user.name "news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "投稿記録 [skip ci]"
            git push
          fi
