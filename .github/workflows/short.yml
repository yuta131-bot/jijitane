# YouTube ショート用の縦長動画（1080x1920・mp4）を作る
#   読み上げは VOICEVOX エンジン（無料・Docker）で作成。音声のクレジット表記：「VOICEVOX:冥鳴ひまり」
#   できた動画は、GitHub の Releases にのせる（スマホからそのままダウンロードできる）
name: ショート動画を作る
on:
  schedule:
    - cron: "45 21 * * *"   # UTC 21:45 = 日本時間 6:45（下書きのマージを待つ。7:30 の Instagram 投稿より前に作り終える）
  workflow_dispatch:
    inputs:
      date:
        description: "日付（空なら今日）例：2026-10-27"
        required: false
      youtube:
        description: "YouTube に上げる（手動のとき。毎朝の自動実行では、いつも公開で上げる）"
        type: choice
        options:
          - しない
          - 限定公開で上げる
          - 公開で上げる
        default: しない

permissions:
  contents: write

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 道具を入れる
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk >/dev/null
          pip install -q playwright==1.49.1
          python -m playwright install --with-deps chromium >/dev/null
      - name: 日付を決める
        id: d
        run: |
          D="${{ inputs.date }}"; [ -z "$D" ] && D="$(TZ=Asia/Tokyo date +%F)"
          echo "date=$D" >> "$GITHUB_OUTPUT"
      - name: その日の号があるか確かめる
        id: has
        run: |
          if [ -f "content/${{ steps.d.outputs.date }}.json" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "まだ号がありません"; fi
      - name: 読み上げエンジンの起動を待つ
        if: steps.has.outputs.ok == 'true'
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:50021/version && exit 0; sleep 3; done; echo "VOICEVOX が起動しませんでした"; exit 1
      - name: 動画を作る
        if: steps.has.outputs.ok == 'true'
        run: python scripts/make_short.py --date "${{ steps.d.outputs.date }}" --out dist-video --voicevox http://localhost:50021
      - name: 夕方のクイズ動画を作る（Instagram 用）
        if: steps.has.outputs.ok == 'true'
        continue-on-error: true
        run: python scripts/make_short.py --date "${{ steps.d.outputs.date }}" --out dist-video --voicevox http://localhost:50021 --mode quiz
      - name: Releases にのせる
        if: steps.has.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ steps.d.outputs.date }}
        run: |
          T="short-$D"
          gh release delete "$T" --yes --cleanup-tag 2>/dev/null || true
          { echo "タイトル：$(cat dist-video/short-$D-title.txt)"; echo; echo "説明："; cat "dist-video/short-$D.txt"; } > notes.txt
          gh release create "$T" --prerelease --title "ショート動画 $D" --notes-file notes.txt \
            "dist-video/short-$D.mp4" "dist-video/short-$D-thumb.png" \
            $(ls dist-video/short-$D-quiz.mp4 dist-video/short-$D-quiz-thumb.png dist-video/short-$D-quiz.txt dist-video/short-$D-quiz-title.txt 2>/dev/null)
          echo "動画：${{ github.server_url }}/${{ github.repository }}/releases/tag/$T" >> "$GITHUB_STEP_SUMMARY"
      - name: YouTube に上げる（子ども向け）
        # 毎朝の自動実行：公開で上げる／手動：選んだときだけ上げる
        if: steps.has.outputs.ok == 'true' && (github.event_name == 'schedule' || inputs.youtube == '限定公開で上げる' || inputs.youtube == '公開で上げる')
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ (github.event_name == 'schedule' || inputs.youtube == '公開で上げる') && 'public' || 'unlisted' }}
        run: python scripts/upload_youtube.py --date "${{ steps.d.outputs.date }}" --dir dist-video --privacy "$PRIVACY"
