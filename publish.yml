# 記事がマージされたらサイトを公開し、7時以降なら X に投稿する
name: 公開とX投稿
on:
  push:
    branches: [main]
    paths: ["content/**", "src/**", "scripts/**", "site.config.json"]
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 日本時間 7:00（マージが早朝に済んでいた日の投稿用）
  workflow_dispatch:
    inputs:
      force_post:
        description: "時刻に関係なく今日の号を投稿する"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-zen-maru-v1
      - run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4

  post:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-zen-maru-v1
      - name: X に投稿
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FORCE_POST: ${{ inputs.force_post }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/post-x.mjs
      - name: 投稿の記録を残す
        run: |
          if ! git diff --quiet state/; then
            git config user.name "news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "投稿記録 [skip ci]"
            git push
          fi
